const state = { sortKey: 'bike', sortDir: 1 };
const $ = id => document.getElementById(id);

function fmtPrice(r) {
  if (r.price == null) return '?';
  let s = '$' + r.price.toLocaleString() + (r.is_building ? '+' : '');
  if (r.ppb && !r.is_room && r.bedrooms > 1) s += '<br><span class="muted">$' + Math.round(r.ppb).toLocaleString() + '/bedroom</span>';
  return s;
}
function fmtSize(r) {
  let s = (r.bedrooms == null ? '?' : r.bedrooms) + 'bd' + (r.bathrooms ? ' / ' + r.bathrooms + 'ba' : '');
  if (r.sqft) s += '<br><span class="muted">' + r.sqft.toLocaleString() + ' sqft</span>';
  if (r.is_room) s += '<br><span class="muted">room in shared home</span>';
  return s;
}
function fmtBike(r) {
  if (r.bike == null) return '?';
  let s = Math.round(r.bike) + ' min';
  if (r.km != null) s += '<br><span class="muted">' + r.km.toFixed(1) + ' km' + (r.climb != null ? ', ' + (r.climb >= 0 ? '+' : '') + Math.round(r.climb) + ' m' : '') + '</span>';
  return s;
}
function fmtLease(r) {
  if (r.lease_months) return r.lease_months + ' mo' + (r.lease_note ? '<br><span class="muted">“' + esc(r.lease_note) + '”</span>' : '');
  return r.lease_note ? esc(r.lease_note) : '<span class="muted">unstated</span>';
}
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function passes(r) {
  const v = id => $(id).value;
  if (!$('showExcluded').checked && r.excluded) return false;
  if ($('unitsOnly').checked && r.is_room) return false;
  if (v('priceMin') && (r.price == null || r.price < +v('priceMin'))) return false;
  if (v('priceMax') && (r.price == null || r.price > +v('priceMax'))) return false;
  if (v('ppbMax') && (r.ppb == null || r.ppb > +v('ppbMax'))) return false;
  if (v('bedsMin') && (r.bedrooms == null || r.bedrooms < +v('bedsMin'))) return false;
  if (v('bedsMax') && (r.bedrooms == null || r.bedrooms > +v('bedsMax'))) return false;
  if (v('bikeMax') && (r.bike == null || r.bike > +v('bikeMax'))) return false;
  if (v('postedAfter') && (!r.posted || r.posted < v('postedAfter'))) return false;
  if (v('postedBefore') && (!r.posted || r.posted > v('postedBefore'))) return false;
  if (v('source') !== 'all' && r.source !== v('source')) return false;
  const q = v('search').trim().toLowerCase();
  if (q && !(r.title + ' ' + r.address + ' ' + r.description + ' ' + r.flags.join(' ')).toLowerCase().includes(q)) return false;
  return true;
}
function cmp(a, b) {
  const k = state.sortKey; let x = a[k], y = b[k];
  if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
  if (typeof x === 'string') { x = x.toLowerCase(); y = y.toLowerCase(); }
  return (x < y ? -1 : x > y ? 1 : 0) * state.sortDir;
}
function render() {
  const rows = ROWS.filter(passes).sort(cmp);
  $('count').textContent = rows.length + ' of ' + ROWS.length + ' listings shown';
  $('tbody').innerHTML = rows.map(r => '<tr class="' + (r.excluded ? 'excluded' : '') + '">' +
    '<td>' + (r.image ? '<img src="' + esc(r.image) + '" alt="" loading="lazy">' : '') + '</td>' +
    '<td><a href="' + esc(r.url) + '" target="_blank"><b>' + esc(r.title.slice(0, 90)) + '</b></a><br><span class="muted">' + esc(r.address) + '</span><br><span class="muted">' + esc(r.description.slice(0, 260)) + (r.description.length > 260 ? '…' : '') + '</span>' + (r.photos != null ? '<br><span class="muted">' + r.photos + ' photos</span>' : '') + '</td>' +
    '<td>' + fmtPrice(r) + '</td><td>' + fmtSize(r) + '</td><td>' + fmtBike(r) + '</td>' +
    '<td>' + (r.posted || '') + '</td><td>' + fmtLease(r) + '</td>' +
    '<td>' + r.flags.map(f => '<span class="muted">' + esc(f) + '</span>').join('<br>') + (r.excluded ? '<br><span class="muted">excluded: ' + esc(r.excluded) + '</span>' : '') + '</td>' +
    '<td><a href="' + esc(r.url) + '" target="_blank">' + r.source + '</a><br><span class="muted">seen ' + r.first_seen + '</span></td></tr>').join('');
  document.querySelectorAll('th[data-key]').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === state.sortKey);
    th.dataset.arrow = state.sortDir === 1 ? '▲' : '▼';
  });
}
document.querySelectorAll('th[data-key]').forEach(th => th.addEventListener('click', () => {
  if (state.sortKey === th.dataset.key) state.sortDir *= -1; else { state.sortKey = th.dataset.key; state.sortDir = th.dataset.key === 'posted' || th.dataset.key === 'first_seen' ? -1 : 1; }
  render();
}));
document.querySelectorAll('.controls input, .controls select').forEach(el => el.addEventListener('input', render));
$('reset').addEventListener('click', () => { document.querySelectorAll('.controls input').forEach(el => { if (el.type === 'checkbox') el.checked = el.id === 'unitsOnly' ? false : false; else el.value = ''; }); $('source').value = 'all'; render(); });
function ago() {
  const gen = new Date($('refreshed').dataset.generated); const mins = Math.round((Date.now() - gen) / 60000);
  const text = mins < 60 ? mins + ' min ago' : mins < 2880 ? Math.round(mins / 60) + ' hours ago' : Math.round(mins / 1440) + ' days ago';
  $('ago').textContent = '(' + text + ')';
}
$('reload').addEventListener('click', () => { location.href = location.pathname + '?t=' + Date.now(); });
ago(); setInterval(ago, 60000);
render();
